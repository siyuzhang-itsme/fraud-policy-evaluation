name: Reproduce D04 public release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate fictional inputs
        run: python code/generate_demo_inputs.py
      - name: Run all tests
        run: python -m unittest discover -s code -p 'test_*.py' -q
      - name: Regenerate published outputs and dashboard
        run: |
          python code/build_feedback_loop.py
          python code/build_baseline_comparison.py
          python code/build_v11.py
      - name: Check outputs are byte-identical to publication
        run: git diff --exit-code -- results/feedback_loop_metrics.json results/baseline_comparison.json docs/index.html
