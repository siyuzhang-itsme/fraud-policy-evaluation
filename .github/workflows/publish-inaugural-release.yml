name: Publish inaugural Fraud Policy Evaluation release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-inaugural-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish version 1.0.0 once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo 'Release v1.0.0 already exists; no action taken.'
            exit 0
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## Overview

          The inaugural citable public release of Fraud Policy Evaluation: a reproducible, fully fictional demonstration of evidence-based payment screening, fraud-rule governance, dispute handling, and recovery-policy evaluation.

          ## Included

          - An offline interactive dashboard in `docs/index.html`.
          - Synthetic scenario generators, evaluators, tests, and reproducible comparison results.
          - A documented framework for retaining, refining, retiring, or deferring fraud controls as evidence matures.
          - An MIT license and machine-readable citation metadata in `CITATION.cff`.

          ## Reproduction

          Requires Python 3.11+.

          ```bash
          python -m pip install -r requirements.txt
          python code/generate_demo_inputs.py
          python -m unittest discover -s code -p 'test_*.py' -q
          python code/build_feedback_loop.py
          python code/build_baseline_comparison.py
          python code/build_v11.py
          ```

          ## Data and interpretation

          All examples, records, rules, assumptions, and calculated results are fictional and synthetic; there are no real customer or employer records, proprietary production policies, or actual production outcomes. Monetary figures illustrate model mechanics, not empirically measured benefits or deployment effects. Consult README.md and DATA_DICTIONARY.md for boundaries and assumptions.
          NOTES
          gh release create v1.0.0 --target "$GITHUB_SHA" --title 'Fraud Policy Evaluation: Payment Decisions, Disputes & Recovery (v1.0.0)' --notes-file "$RUNNER_TEMP/release-notes.md"
